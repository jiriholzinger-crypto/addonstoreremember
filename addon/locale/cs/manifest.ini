summary = "Paměť řazení v Katalogu doplňků"
description = """Umožňuje zvolit, na které kartě se Katalog doplňků NVDA otevře, a pamatuje si, jak je seřazen seznam doplňků, například podle data zveřejnění nebo data instalace, od nejnovějších. Může si pamatovat vaši poslední volbu pro každou kartu, nebo vždy použít pevně nastavené řazení. Nastavuje se v Nastavení NVDA, kategorie Paměť řazení v Katalogu doplňků."""
